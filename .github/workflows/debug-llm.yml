name: DebugLLM
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install litellm -q
      - name: Run debug
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          curl -s -w "HTTP_CODE:%{http_code}" -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d '{"model":"'$OPENAI_MODEL'","messages":[{"role":"user","content":"回复OK"}],"max_tokens":10}' "$OPENAI_BASE_URL/chat/completions"
          echo ""
          python3 scripts/debug_sensenova.py
